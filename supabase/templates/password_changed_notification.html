<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Your password was changed</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
  </head>
  <body style="margin:0;padding:0;background:#f3ece2;">
    <!-- Shown as the preview line in most inboxes. -->
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">The password for your account was changed.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f3ece2;">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <img src="{{ .SiteURL }}/apple-icon.png" width="40" height="40" alt="" style="display:block;border:0;border-radius:20px;">
                <p style="margin:12px 0 0;font-family:'Fraunces', Georgia, 'Times New Roman', serif;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:#a3978b;">Eventide</p>
              </td>
            </tr>
            <tr>
              <td style="background:#faf6f0;border:1px solid #e8dfd2;border-radius:20px;padding:40px 36px;">
              <h1 style="margin:0;font-family:'Fraunces', Georgia, 'Times New Roman', serif;font-size:28px;font-weight:300;line-height:1.25;letter-spacing:-0.01em;color:#3d342c;">Your password was changed</h1>
              <p style="margin:16px 0 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:16px;line-height:1.6;color:#7a6e63;">The password for {{ .Email }} was just changed. If that was you, there’s nothing more to do.</p>
              
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 24px 0;">
                <p style="margin:0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px;line-height:1.6;color:#a3978b;">Wasn’t you? Reset your password straight away.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
